<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Happy Valentine 💕</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card {
  background: #fff0f5;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
  max-width: 350px;
  position: relative;
  z-index: 2;
  animation: float 3s ease-in-out infinite;
}

h1 {
  font-family: 'Pacifico', cursive;
  color: #ff69b4;
  font-size: 34px;
}

p {
  color: #d63384;
  font-size: 15px;
  line-height: 1.6;
}

.heart {
  font-size: 45px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

button {
  margin-top: 12px;
  background: #ff69b4;
  border: none;
  padding: 10px 18px;
  color: white;
  font-size: 14px;
  border-radius: 20px;
  cursor: pointer;
}

button:hover {
  background: #ff85c1;
}

/* ANIMASI HATI JATUH */
.falling-heart {
  position: fixed;
  top: -10px;
  font-size: 20px;
  animation: fall linear infinite;
  opacity: 0.8;
}

@keyframes fall {
  0% { transform: translateY(-10px); }
  100% { transform: translateY(110vh); }
}
</style>
</head>

<body>

<!-- MUSIK KASIH PUTIH -->
<iframe id="music"
src="https://www.youtube.com/embed/8qQYjH1QfWg?enablejsapi=1"
allow="autoplay"
style="display:none;"></iframe>

<div class="card">
  <div class="heart">💖</div>
  <h1>Happy Valentine</h1>

  <p>
    Untuk <b>Vidyaa</b> 🌸<br><br>
    Kamu itu sederhana tapi spesial,<br>
    dan entah kenapa bikin nyaman 🤍
  </p>

  <p><i>
    Today, I just want you to know 💕<br>
    you make my days brighter.<br>
    Happy Valentine, Vidyaa 🌷
  </i></p>

  <button onclick="playMusic()">🎵 Putar Lagu</button><br>
  <button onclick="jawab()">💝 Mau jadi Valentine-ku?</button>
</div>

<script>
// PLAY MUSIC
function playMusic() {
  const iframe = document.getElementById("music");
  iframe.src += "&autoplay=1";
}

// JAWABAN TOMBOL
function jawab() {
  alert("Yayyy! Makasih ya 💕 Aku seneng banget 😆💖");
}

// GENERATE HATI JATUH
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "falling-heart";
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (3 + Math.random() * 3) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}, 300);
</script>

</body>
</html>
