<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Vidyaa 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 360px;
      width: 90%;
      position: relative;
    }
    h1 { font-size: 2em; }
    p { font-size: 1.05em; }
    button {
      border: none;
      padding: 12px 20px;
      font-size: 1em;
      border-radius: 30px;
      cursor: pointer;
      margin: 6px;
      transition: 0.3s;
    }
    .yes { background: #ff4d6d; color: #fff; }
    .no {
      background: #fff;
      color: #ff4d6d;
      position: absolute;
    }
    img {
      width: 100%;
      border-radius: 15px;
      margin-top: 10px;
    }
    .heart {
      position: absolute;
      font-size: 18px;
      animation: float 4s linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
    .password {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input {
      padding: 10px;
      border-radius: 20px;
      border: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <audio id="bgMusic" autoplay loop>
    <source src="kasih-putih.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
  </audio>  <div class="card" id="lock">
    <h1>💌 Secret Valentine</h1>
    <p>Enter the password first 😳</p>
    <div class="password">
      <input type="password" id="pass" placeholder="Password" />
      <button class="yes" onclick="checkPass()">Unlock 💖</button>
    </div>
  </div>  <div class="card" id="content" style="display:none;">
    <h1>Happy Valentine, Vidyaa 💕</h1>
    <p>
      From the first moment until now,<br>
      kamu selalu bikin aku smile every day 💫<br>
      Will you be my Valentine today and always?
    </p><img src="foto1.jpg" alt="Foto 1">
<img src="foto2.jpg" alt="Foto 2">

<br><br>
<button class="yes" onclick="yesClick()">Yes 💖</button>
<button class="no" id="noBtn" onmouseover="moveNo()">No 🙈</button>

  </div>  <script>
    function checkPass() {
      const pass = document.getElementById('pass').value;
      if (pass === '07-11-2008') {
        document.getElementById('lock').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } else {
        alert('Wrong password 😅');
      }
    }

    function yesClick() {
      document.getElementById('content').innerHTML = `
        <h1>I’m so happy 💞</h1>
        <p>
          Thank you, Vidyaa ❤️<br>
          You just made my heart super full today 🥰<br>
          Happy Valentine, my favorite person 💘
        </p>`;
    }

    function moveNo() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.bottom = '0px';
      heart.style.fontSize = Math.random() * 20 + 15 + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }
    setInterval(createHeart, 300);
  </script></body>
</html>
